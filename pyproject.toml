[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holdgrasp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "transformers==4.57.1",
    "ultralytics>=8.0",
    "opencv-python-headless>=4.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
holdgrasp = "holdgrasp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/holdgrasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
